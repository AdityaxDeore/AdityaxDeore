<svg xmlns="http://www.w3.org/2000/svg" width="450" height="80" viewBox="0 0 450 80"><defs><linearGradient id="btnGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1f6feb"/><stop offset="100%" stop-color="#58a6ff"/></linearGradient><linearGradient id="shimmerGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".3"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient><style>@keyframes pulse{0%{filter:drop-shadow(0 2px 5px rgba(31,111,235,.4))}50%{filter:drop-shadow(0 5px 15px rgba(88,166,255,.7))}}@keyframes shimmer{0%{transform:translateX(-450px) skewX(-20deg)}}.btn-bg{fill:url(#btnGrad);rx:16px}.btn-subtext,.btn-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.btn-text{font-size:18px;font-weight:700;fill:#fff;letter-spacing:1px}.btn-subtext{font-size:11px;font-weight:600;fill:rgba(255,255,255,.8);letter-spacing:1.5px}.animated-glow{animation:pulse 3s infinite ease-in-out}.shimmer-rect{animation:shimmer 3s infinite linear}</style></defs><g class="animated-glow"><rect width="450" height="80" class="btn-bg" rx="16"/></g><g clip-path="url(#clipBtn)"><clipPath id="clipBtn"><rect width="450" height="80" rx="16"/></clipPath><rect width="250" height="80" fill="url(#shimmerGrad)" class="shimmer-rect" opacity=".6"/></g><g><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" opacity=".95" transform="translate(35, 0) translate(12, 28)"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10M12 2a15.3 15.3 0 0 0-4 10 15.3 15.3 0 0 0 4 10"/></g><text x="50" y="38" class="btn-text" transform="translate(35, 0)">VISIT PORTFOLIO WEBSITE</text><text x="50" y="55" class="btn-subtext" transform="translate(35, 0)">adityadeore.vercel.app</text><path fill="#fff" d="M340 40 L328 32 L328 48 Z" opacity=".95" transform="translate(